<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#f2830f"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d96f06"/>
      <stop offset="1" stop-color="#b25600"/>
    </linearGradient>
  </defs>

  <!-- 아이콘 전체가 기울어진 스티키 노트: 실루엣 자체로 구분 -->
  <g transform="rotate(-6 512 512)">
    <!-- 그림자 -->
    <path d="M150 130 h724 a48 48 0 0 1 48 48 v560 l-190 190 h-582 a48 48 0 0 1 -48 -48 v-702 a48 48 0 0 1 48 -48 z"
          fill="#000000" opacity="0.25" transform="translate(14 26)"/>
    <!-- 노트 본체 (오른쪽 아래 접힘) -->
    <path d="M150 130 h724 a48 48 0 0 1 48 48 v560 l-190 190 h-582 a48 48 0 0 1 -48 -48 v-702 a48 48 0 0 1 48 -48 z"
          fill="url(#note)"/>
    <!-- 접힌 귀퉁이 -->
    <path d="M922 738 l-190 190 v-142 a48 48 0 0 1 48 -48 z" fill="url(#fold)"/>
    <!-- 번개: 빠른 메모(Ctrl+Alt+M)의 상징 -->
    <path d="M584 208 L364 550 h124 L438 828 L716 442 h-142 L664 208 z"
          fill="#ffffff"/>
